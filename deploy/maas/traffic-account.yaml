# ServiceAccount used by scripts/traffic-test.sh to drive demo traffic.
#
# The script mints a short-lived token with
#
#   oc create token openclaw-app -n models-as-a-service --duration=1h
#
# and sends `x-maas-username: openclaw_app` so the gateway meters the calls
# against the OpenMeter subject "openclaw_app". Kubernetes ServiceAccount names
# cannot contain underscores, hence the name/token-name split.
#
# Apply this before running the traffic script:
#
#   oc apply -f deploy/maas/traffic-account.yaml
#   ./scripts/set-balance.sh --user openclaw_app --dollars 5
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-app
  namespace: models-as-a-service
  labels:
    app: maas-traffic-test
